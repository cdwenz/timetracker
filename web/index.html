<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ihadi Time Tracker - Daily work log app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FC6502">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TimeTracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="preload" href="icons/Icon-192.png" as="image">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ihadi Time Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF;
      transition: opacity 400ms ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; margin-bottom: 28px; border-radius: 20px; box-shadow: 0 4px 20px rgba(252,101,2,0.15); }
    #splash .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(252,101,2,0.18);
      border-top-color: #FC6502;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #splash .label { margin-top: 18px; color: #555; font-size: 14px; letter-spacing: 0.3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="" />
    <div class="spinner"></div>
    <div class="label">Cargando...</div>
  </div>

  <script>
    // Oculta el splash en cuanto Flutter renderiza el primer frame
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hidden');
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
